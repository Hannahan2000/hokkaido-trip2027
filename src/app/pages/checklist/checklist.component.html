<div class="space-y-5 pb-32 animate-fade-in relative">

  <!-- 標題與進度列 -->
  <div>
    <h2 class="text-blue-400 font-bold text-lg mb-3 flex items-center justify-between">
      <span>東西都帶齊了嗎？</span>
      <span class="text-xs text-blue-400 font-normal bg-blue-50 px-3 py-1 rounded-full">
        進度 {{ progress }}%
      </span>
    </h2>
    <!-- 進度條 (加粗一點讓視覺更清楚) -->
    <div class="w-full bg-slate-200 rounded-full h-2">
      <div class="bg-blue-400 h-2 rounded-full transition-all duration-500 ease-out"
           [style.width.%]="progress"></div>
    </div>
  </div>

  <!-- 新增物品輸入區 (加高 h-12，讓手指更好點擊) -->
  <div class="flex gap-2">
    <input #newItem (keyup.enter)="add(newItem)" type="text" placeholder="還需要帶什麼呢？..."
           class="flex-1 h-12 bg-white border border-slate-200 rounded-md px-4 text-base text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 shadow-sm transition-all">
    <button (click)="add(newItem)"
            class="h-12 px-4 bg-blue-400 text-white rounded-md text-base font-bold shadow-md shadow-blue-400/20 active:scale-95 transition-transform shrink-0">
      加入
    </button>
  </div>

  <!-- 物品清單 -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">

    <!-- 判斷如果清單是空的 -->
    <div *ngIf="items.length === 0" class="p-6 text-center text-slate-400 text-sm">
      目前沒有任何物品，趕快新增吧！
    </div>

    <!-- 列表項目 -->
    <div *ngFor="let item of items; let last = last"
         (click)="toggle(item)"
         class="flex items-center justify-between p-4 cursor-pointer active:bg-slate-50 transition-colors"
         [ngClass]="{'border-b border-slate-100': !last}">

      <!-- 左側：打勾框框 + 文字 (加上 flex-1 確保佔滿剩餘空間) -->
      <div class="flex items-center gap-4 flex-1">

        <!-- 明顯的打勾方塊 (放大為 w-6 h-6) -->
        <div class="w-6 h-6 rounded-md border-2 flex items-center justify-center transition-colors duration-200 shrink-0"
             [ngClass]="item.done ? 'bg-blue-400 border-blue-400' : 'border-slate-300 bg-slate-50'">
          <svg *ngIf="item.done" class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>

        <!-- 物品名稱 -->
        <span class="text-base transition-all duration-200"
              [ngClass]="item.done ? 'text-slate-400 line-through' : 'text-slate-700 font-medium'">
          {{ item.text }}
        </span>
      </div>

      <!-- 右側：刪除按鈕 (放大一點比較好按) -->
      <button (click)="delete(item, $event)" class="text-slate-300 hover:text-red-400 p-2 -mr-2 shrink-0 active:scale-90 transition-transform">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

    </div>
  </div>

</div>
